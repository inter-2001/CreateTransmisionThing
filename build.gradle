buildscript {
    repositories {
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }
    dependencies {
        classpath 'net.neoforged:moddev-gradle:2.0.141'
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
}

apply plugin: 'net.neoforged.moddev'

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = findProperty('artifact_id') ?: mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

repositories {
    maven {
        // Sable, Sable Companion, Simulated
        name = 'Sable Releases'
        url = 'https://maven.ryanhcode.dev/releases'
    }
    maven {
        // Create, Ponder (includes Catnip), Flywheel
        name = 'Create'
        url = 'https://maven.createmod.net'
    }
    maven {
        // Registrate (needed to compile against Create's block entries)
        name = 'Registrate'
        url = 'https://maven.ithundxr.dev/snapshots'
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources').getAbsolutePath(),
                    '--existing', file('src/main/resources').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Every dependency is compile-time only (players install them as separate mods) and is also put on the
// dev-run classpath via localRuntime. transitive=false keeps each mod from pulling in its own copies of others.
def externalMods = [
        "com.simibubi.create:create-${minecraft_version}:${create_version}:slim",
        "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}",
        "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}",
        "com.tterrag.registrate:Registrate:${registrate_version}",
        "dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_api_version}",
        "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}",
        "dev.simulated_team.simulated:simulated-neoforge-${minecraft_version}:${simulated_api_version}",
]

dependencies {
    externalMods.each { coordinate ->
        compileOnly(coordinate) { transitive = false }
        localRuntime(coordinate) { transitive = false }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            sable_version_range   : sable_version_range,
            simulated_version_range : simulated_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('verifyCompatibilityContract', JavaExec) {
    group = 'verification'
    description = 'Check block-entity ids, persistent link tags, and the Sable 2.x minimum dependency.'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.enxv.aerouniversaljoint.verification.CompatibilityContractRegressionCheck'
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyCompatibilityContract')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into ''
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
